[build-system]
requires = ["setuptools", "scikit-build-core", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"


[project]
name = "nwgrad"
dependencies = ["numpy"]
description = "High-performance sequence alignment with gradients of the score w.r.t. the substitution matrix."
version = "0.5.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Michał Startek"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]
keywords = ["sequence-alignment", "gradient", "substitution-matrix",
            "Needleman-Wunsch", "Smith-Waterman", "nanobind", "C++", "Python"]

[project.urls]
Homepage = "https://github.com/michalsta/nwgrad"
Repository = "https://github.com/michalsta/nwgrad"


[project.optional-dependencies]
dev = ["pytest", "pytest-rerunfailures", "biopython"]

[tool.pytest.ini_options]
testpaths = ["tests/Python"]

# PyPy is deliberately NOT built.  This is a nanobind C-extension whose test extras
# pull biopython, for which no PyPy wheels are published — pip would compile it from
# source under the build environment, where the macOS arm's LDFLAGS='-static-libgcc'
# (a gcc-only flag we set for our own extension) is handed to biopython's clang build
# and rejected outright.  CPython wheels dodge this entirely: every test dependency
# has a prebuilt wheel, so nothing is compiled at test time.  PyPy was never a target.
[tool.cibuildwheel]
skip = ["cp36-*", "cp37-*", "cp38-*", "cp39-*", "pp*"]
test-command = "python -m pytest {project}/tests/Python"
test-extras = ["dev"]

# Package builds need only the extension; tests and benchmarks are not in the sdist.
[tool.scikit-build.cmake.define]
NWGRAD_BUILD_TESTS = "OFF"
NWGRAD_BUILD_BENCHMARKS = "OFF"

[tool.scikit-build.sdist]
# An ALLOWLIST, written as gitignore negation: exclude everything at the top level,
# then re-admit what building the package and distributing the C++ headers needs.
# Not `include`: in scikit-build-core an include rule beats .gitignore too, so
# include = ["src/**"] would ship __pycache__ and any stray in-tree .so.  A negated
# exclude merely falls through, and .gitignore still applies underneath it.
# Without this, a local `python -m build --sdist` collected every untracked file in
# the working tree (a 106 MB FASTA, whole build directories, editor settings).
# tests/Python/test_sdist_contents.py checks both directions.
exclude = [
    "/*",
    "!/src",   # no trailing slash: the walker tests directories as "src", which "!/src/" misses
    "!/CMakeLists.txt",
    "!/pyproject.toml",
    "!/README.md",
    "!/LICENSE",
]
