name: Wheels

# Build the distributable, runtime-dispatched wheels.  Each wheel is ONE binary that
# carries every ISA level (baseline/AVX2/AVX-512 on x86, NEON on ARM) and picks one at
# load — so the compiler choice below is about which toolchain generates the fastest
# std::simd kernels, not about targeting a CPU.
#
# COMPILER POLICY — per-arch, because clang is NOT uniformly faster (measured):
#   * x86_64 Linux  -> gcc.  CLANG DISABLED 2026-07-29 (it is commented out, not deleted;
#     grep "CLANG SWITCH" for the three edits that bring it back).  The justification for
#     the clang arm had gone stale and did not survive re-measurement:
#     It read "~+36% over gcc on the std::simd kernels (AVX2), and the fastest float32
#     config measured anywhere."  That was measured on the PROTOTYPE kernel (variant A,
#     W=4, len=200, forward-only), before striping shipped, before the 64-byte allocator,
#     before the sweeps and hb_base were vectorized, and before the prefix-max carry
#     became the float32 default.  Re-measured end-to-end on the shipped paths
#     (tools/bench_toolchain.sh, 2026-07-29, 1 thread, best-of-3, scalar control arm):
#       - AVX2: clang is +2.4% on the default float32 path and -1.1% on the pointers
#         kernel, while being +11.4% on the SCALAR control.  So clang's remaining edge
#         there is general codegen, NOT std::simd; relative to the control it is 8-11%
#         WORSE at the kernels than gcc.  At 8 threads everything ties within +/-3%.
#       - SSE2/W=2: clang 22 IS genuinely faster (+7.8% pmax, +10.6% hb_base, relative
#         to control), and this is not a gcc-15 regression (gcc 13.4 beat gcc 15.2 and
#         clang still won).  But the win tracks the CLANG VERSION: clang 18 on the same
#         microarchitecture gains only ~1%.  manylinux_2_28's `dnf install clang` ships
#         clang ~17-18, so this build most likely gets the ~1% version, not the ~10% one.
#         NOT verified in-container (no container runtime on the test fleet).
#     DECISION: switched to gcc.  clang no longer buys what the comment claimed; the one
#     surviving win needs clang >= 21, which the build containers do not ship.  Going gcc
#     also drops the `dnf install clang` step and stops shipping a binary that leans on the
#     clang-only _mm512_cmp_pd_mask path in the AVX-512 level.  (That workaround STAYS in
#     the source — it is still needed by anyone building from sdist with clang, which is a
#     supported and tested configuration; CI's ci.yml builds both compilers on every push.
#     This changes only which binary is uploaded to PyPI.)
#
#     WHEN TO REVISIT — any of these makes the clang arm worth re-measuring, not
#     re-enabling on faith; run tools/bench_toolchain.sh on the fleet first:
#       - the default build image starts shipping clang >= 21 (the version where the
#         W=2 win appears: +8% pmax sweep, +11% hb_base, relative to control);
#       - the SSE2/baseline level stops being the fallback for most old x86 CPUs;
#       - the float32 default carry changes again (clang and gcc disagree PER ALGORITHM —
#         clang favours the pmax sweep and hb_base, gcc favours the exact lazy-F sweep,
#         so the right compiler moves when the default algorithm moves).
#   * aarch64 Linux -> gcc.    On NEON gcc beats clang by ~24%; clang would ship a
#     slower ARM wheel.
#   * macOS arm64   -> Homebrew gcc.  Apple's own clang ships libc++, which has NO
#     <experimental/simd> at all, so the vectorized kernels cannot be built with the
#     system toolchain; and gcc is the faster NEON backend besides.
#   * Windows       -> not built.  MSVC has no <experimental/simd>, so a Windows build
#     has no vectorized kernels and would be slower than tools already available there.
#     A source install under MSVC fails honestly at the missing header (by design — the
#     level-TU gate in CMakeLists is on the CPU, never the compiler).
#
# Deliberately NO LTO: register_level() must be emitted as baseline code (it runs at
# static-init on every CPU, including ones without AVX-512), and LTO could hoist a wide
# instruction into it and SIGILL at load.  That isolation — simd_levels.cpp compiled at
# the plain baseline — is load-bearing and LTO would defeat it.  -O3 (scikit-build-core's
# default Release) is the optimization; the per-ISA -march flags already live in
# CMakeLists per level TU.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── x86_64 Linux: gcc (clang DISABLED 2026-07-29, see COMPILER POLICY) ──
          # TO RE-ENABLE CLANG, three edits, all marked "CLANG SWITCH":
          #   1. swap cc/cxx below to clang / clang++
          #   2. uncomment CIBW_BEFORE_ALL_LINUX (installs clang in the build container)
          #   3. rename this entry and its twin in the test_wheels matrix to "(clang)"
          # Nothing else in the file depends on the choice.
          - name: linux-x86_64 (gcc)          # CLANG SWITCH (1/3): name
            runner: ubuntu-latest
            archs: x86_64
            cc: gcc                           # CLANG SWITCH (1/3): -> clang
            cxx: g++                          # CLANG SWITCH (1/3): -> clang++
          - name: linux-aarch64 (gcc)
            runner: ubuntu-24.04-arm
            archs: aarch64
            cc: gcc
            cxx: g++
          - name: macos-arm64 (gcc)
            runner: macos-14
            archs: arm64
            # cc/cxx unused on macOS — CIBW_ENVIRONMENT_MACOS (set dynamically in the
            # Homebrew step) pins the versioned Homebrew g++.  Placeholders keep the
            # CIBW_ENVIRONMENT_LINUX template below from expanding to a bare "CC= CXX=".
            cc: gcc
            cxx: g++
          # No Windows: MSVC lacks <experimental/simd>, so a Windows build has no
          # vectorized kernels and would be slower than tools already available there.
          # A source install under MSVC fails honestly at the missing header.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # macOS: the system toolchain cannot build the kernels (Apple libc++ lacks
      # <experimental/simd>).  Install Homebrew gcc and pin CC/CXX to the versioned
      # binaries it drops (g++-15, g++-14, ... — resolved dynamically so a Homebrew
      # bump does not break this).  LDFLAGS statically links libstdc++/libgcc so the
      # wheel does not depend on Homebrew's copies at the user's runtime; CMake seeds
      # CMAKE_SHARED_LINKER_FLAGS from LDFLAGS at first configure.  The spaced LDFLAGS
      # value is single-quoted because cibuildwheel splits its environment on spaces.
      - name: Set up Homebrew gcc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          GXX="$(ls "$(brew --prefix)"/bin/g++-[0-9]* | sort -V | tail -1)"
          GCC="$(ls "$(brew --prefix)"/bin/gcc-[0-9]* | sort -V | tail -1)"
          echo "Using $GXX / $GCC"
          echo "CIBW_ENVIRONMENT_MACOS=CC=$GCC CXX=$GXX MACOSX_DEPLOYMENT_TARGET=11.0 LDFLAGS='-static-libstdc++ -static-libgcc'" >> "$GITHUB_ENV"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

          # CLANG SWITCH (2/3): uncomment the whole CIBW_BEFORE_ALL_LINUX key below to
          # re-enable clang.  Left in place rather than deleted — it is the only fiddly
          # part of the arrangement (three package managers, and it must not fail the
          # build on the arches that do not want clang).
          #
          # x86_64 Linux -> clang.  Install it in each build container (manylinux uses
          # dnf/yum, musllinux uses apk); clang picks up the image's libstdc++, which on
          # current manylinux/musllinux is new enough for <experimental/simd>.  aarch64
          # Linux takes neither branch and builds with the image's default gcc.
          #
          # NOTE if you do re-enable it: whatever `dnf install clang` resolves to is what
          # you get, and the measured win exists only at clang >= 21 (manylinux_2_28
          # ships ~17-18, which measured ~1%).  Pin the version or the switch buys nothing.
          #
          # CIBW_BEFORE_ALL_LINUX: >
          #   if [ "$(uname -m)" = "x86_64" ]; then
          #     (command -v dnf && dnf install -y clang) ||
          #     (command -v yum && yum install -y clang) ||
          #     (command -v apk && apk add --no-cache clang) ||
          #     true;
          #   fi
          # Plain NAME=value — cibuildwheel parses CIBW_ENVIRONMENT with bashlex and
          # rejects command substitution ($(...)), so the compiler is chosen per matrix
          # entry (the arms are already split by arch) rather than by a runtime uname test.
          CIBW_ENVIRONMENT_LINUX: CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}

          # Windows: MSVC default; nothing to override.  (CIBW_ENVIRONMENT_MACOS is set
          # dynamically in the step above.)

          # Every built wheel is import-tested and run through the full Python suite,
          # including the forced-simd pass, so a wheel that dispatched a broken kernel
          # for its host ISA fails here.  test-command / test-extras come from
          # [tool.cibuildwheel] in pyproject.toml.
          CIBW_TEST_COMMAND: >
            python -c "import nwgrad; print('isa', nwgrad.simd_isa(), nwgrad.compiled_with())" &&
            python -m pytest {project}/tests/Python -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  # Re-tests the ACTUAL uploaded .whl files, not the build-time copy cibuildwheel
  # already tested inside the build job. Deliberately separate from build_wheels:
  # it catches anything the upload/download round-trip could break, and it is what
  # publish gates on, so a corrupt or mislabeled artifact fails closed instead of
  # reaching PyPI. One wheel is built per (platform x CPython version); each is
  # installed into a fresh interpreter of the matching version (via uv, which can
  # provision arbitrary CPython versions on demand) and put through the full suite.
  test_wheels:
    name: Test wheels ${{ matrix.name }}
    needs: build_wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CLANG SWITCH (3/3): must stay IDENTICAL to the build_wheels matrix name —
          # the artifact is uploaded as "wheels-<name>" and downloaded by this one, so a
          # mismatch fails the download rather than merely mislabelling the job.
          - name: linux-x86_64 (gcc)
            runner: ubuntu-latest
          - name: linux-aarch64 (gcc)
            runner: ubuntu-24.04-arm
          - name: macos-arm64 (gcc)
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Install and test each wheel with its matching interpreter
        run: |
          set -eu
          for whl in wheelhouse/*.whl; do
            fname=$(basename "$whl" .whl)
            case "$fname" in
              *-musllinux_*)
                # musl-linked wheel; this runner's libc is glibc and has no musl
                # runtime to execute it. cibuildwheel already builds AND tests this
                # wheel natively inside its musllinux container at build time, so
                # skipping it here loses no coverage -- it just isn't re-testable
                # on this host.
                echo "skip $whl: musllinux wheel, no musl runtime on this glibc runner"
                continue
                ;;
            esac
            # Derived from the ABI tag (field 4), not the python tag (field 3): for a
            # free-threaded wheel the two diverge, e.g.
            # nwgrad-0.2.0-cp314-cp314t-manylinux...whl has python tag "cp314" but abi
            # tag "cp314t" -- only the abi tag carries the free-threaded "t". Reading
            # the python tag provisioned a normal 3.14 interpreter for a
            # free-threaded-only wheel, and uv's install rejected it as an
            # incompatible platform.
            abi_tag=$(echo "$fname" | cut -d- -f4)
            pyver=$(echo "$abi_tag" | sed -E 's/^cp([0-9])([0-9]+)t?$/\1.\2/')
            case "$abi_tag" in
              *t) pyver="${pyver}t" ;;
            esac
            # Keyed on the full filename, not just the Python tag: a platform can ship
            # multiple wheels for the same tag (e.g. manylinux + musllinux cp310), and
            # those must not share a venv directory.
            venvdir=".venv-$fname"
            echo "::group::$whl on Python $pyver"
            uv venv "$venvdir" --python "$pyver"
            uv pip install --python "$venvdir/bin/python" "${whl}[dev]"
            "$venvdir/bin/python" -c "import nwgrad; print('isa', nwgrad.simd_isa(), nwgrad.compiled_with())"
            "$venvdir/bin/python" -m pytest tests/Python -q
            echo "::endgroup::"
          done

  # Trusted publishing (OIDC) -- no stored token. This repo+workflow must be
  # registered as a trusted publisher on the PyPI project page first (Publishing ->
  # Trusted Publishers -> Add: owner "michalsta", repo "nwgrad", workflow
  # "wheels.yml", environment "pypi"). Gated on test_wheels so a wheel that fails
  # its post-upload retest never reaches PyPI, and restricted to tag pushes so a
  # manual workflow_dispatch run (used to test the build matrix) never publishes.
  publish:
    name: Publish to PyPI
    needs: [test_wheels, build_sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nwgrad
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
