name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CMakeLists does find_package(nanobind) for the extension target, so even a
      # tests-only configure needs it on the prefix path.
      - name: Install nanobind
        run: pip install nanobind

      # The C++ test binary is not reachable through the Python package, so it
      # only ever runs here: SeqPair/SeqPairBatch from C++, Aligner::alignment(),
      # the precondition throws, and the AlignParams operators.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -Dnanobind_DIR="$(python -m nanobind --cmake_dir)"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  arm:
    # The simd Viterbi kernel has no x86 in it — it is restructured C++ that the
    # compiler vectorizes, and the ISA dispatch table is x86-only scaffolding.  On
    # AArch64 NEON is mandatory baseline, so the kernel simply vectorizes where it
    # stands and the table has a single entry.  That is the path Apple Silicon takes.
    #
    # It is also the path most likely to rot unnoticed, because nobody develops on it.
    # Two things are checked here that ubuntu-latest cannot check:
    #   1. the kernel is still bit-exact when a *different compiler backend* vectorizes
    #      it (the whole design rests on that, and NEON is not SSE2);
    #   2. the vectorizer actually fired.  AArch64 has no gather instruction at all, so
    #      without the query profile the row loop would silently stay scalar and the
    #      kernel would be pure overhead.  Autovectorization is a hope, not a contract.
    name: ARM64 / NEON (Apple Silicon's code path)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nanobind
        run: pip install nanobind

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -Dnanobind_DIR="$(python -m nanobind --cmake_dir)"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Includes test_simd_bitexact, which asserts the NEON-vectorized tables are
      # bit-identical to the scalar ones.  The NWGRAD_ISA cases are no-ops here (there
      # is no dispatch on AArch64) and simply re-run baseline, which is harmless.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The point of the query profile is that it makes the row loop vectorizable at
      # all.  If this grep finds nothing, the profile is buying nothing on ARM and the
      # simd kernel is doing extra work for no gain — which is a failure, not a nit.
      - name: Assert the vectorizer actually fired (NEON)
        run: |
          printf '#include "aligner.hpp"\ntemplate struct Aligner<GapModel::Affine, AlignMode::Global, AlignBand::Full>;\n' > probe.cpp
          g++ -std=c++20 -O3 -I src/nwgrad/cpp/nwgrad \
              -fopt-info-vec-optimized -c probe.cpp -o /dev/null 2> vec.log || true
          echo "--- vectorization report for aligner_simd.hpp ---"
          grep "aligner_simd.hpp" vec.log || true
          if ! grep -q "aligner_simd.hpp.*vectorized" vec.log; then
            echo "::error::the simd row kernels did NOT vectorize on AArch64 —" \
                 "the query profile is not doing its job and kernel=simd is pure overhead here"
            exit 1
          fi

      - name: Python tests
        run: |
          pip install -e ".[dev]"
          python -c "import nwgrad; print('simd_isa() ->', nwgrad.simd_isa())"
          pytest tests/Python/ -q
          # The strongest check there is: if the kernels really are bit-exact, the
          # entire existing suite must pass through the simd one without a single
          # tolerance being loosened.
          NWGRAD_FORCE_KERNEL=simd pytest tests/Python/ -q

  windows:
    # The library had never been compiled with MSVC.  Nothing in it is Unix-specific,
    # but "should compile" and "compiles" are different claims, and the simd header
    # makes the gap wider: it carries `#pragma GCC target` regions and __builtin_cpu_*
    # probes that MSVC has no equivalent for.  Those are #if'd out — MSVC takes the
    # same single-entry fallback path as AArch64 — but an #if'd-out path that nobody
    # ever compiles is exactly how a header-only library breaks for a consumer.
    name: Windows / MSVC
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nanobind
        run: pip install nanobind

      # nanobind reports a Windows path with backslashes, which bash eats before CMake
      # ever sees them.  CMake accepts forward slashes on Windows, so normalise.
      - name: Configure
        run: >
          cmake -S . -B build
          -Dnanobind_DIR="$(python -m nanobind --cmake_dir | tr '\\' '/')"

      # Only the test target.  stress_batch is a developer benchmark, not a shipped
      # artifact, and it leans on glibc-isms (the %' printf group-separator flag) that
      # MSVC does not have.  Letting it fail this job would bury a real portability
      # finding under noise about a benchmark nobody installs.
      #
      # MSVC is a multi-config generator: the build type lives here, not in the
      # configure step, and ctest needs -C to match.
      - name: Build
        run: cmake --build build --target nwgrad_tests --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure -R cpp_tests

      - name: Python tests
        run: |
          pip install -e ".[dev]"
          python -c "import nwgrad; print('simd_isa() ->', nwgrad.simd_isa())"
          pytest tests/Python/ -q
          NWGRAD_FORCE_KERNEL=simd pytest tests/Python/ -q

  no-multiversion:
    # The MSVC / AArch64 fallback path, compiled on x86 where it can actually be run
    # under a sanitizer.  The Windows and ARM jobs above exercise this code, but on
    # platforms where an out-of-bounds read in the row kernels would go unnoticed —
    # neither has ASan here.  This job closes that gap cheaply: same single-entry
    # table, same kernels, but with the sanitizers pointed at them.
    name: C++ tests (single-ISA fallback path, ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: -DNWGRAD_NO_MULTIVERSION=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nanobind
        run: pip install nanobind

      - name: Configure
        run: >
          cmake -S . -B build-nomv -DCMAKE_BUILD_TYPE=Debug
          -DNWGRAD_SANITIZE=ON
          -Dnanobind_DIR="$(python -m nanobind --cmake_dir)"

      - name: Build
        run: cmake --build build-nomv --target nwgrad_tests -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-nomv --output-on-failure

  sanitizers:
    name: C++ tests (${{ matrix.compiler }}, ASan+UBSan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # CMake passes -fno-sanitize-recover=all, so a violation aborts rather than
      # printing and carrying on; these just make the abort legible.
      UBSAN_OPTIONS: print_stacktrace=1
      ASAN_OPTIONS: detect_stack_use_after_return=1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nanobind
        run: pip install nanobind

      # The DP indexes a raw double* with encoded sequence indices and the batch
      # code hands spans across threads, so out-of-bounds reads here would be
      # silent. ASan and UBSan are what make them loud.
      - name: Configure
        run: >
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DNWGRAD_SANITIZE=ON
          -Dnanobind_DIR="$(python -m nanobind --cmake_dir)"

      - name: Build
        run: cmake --build build-san --target nwgrad_tests -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest tests/Python/ -q

  python-sanitize:
    # The C++ ASan job exercises the headers.  It cannot exercise the *bindings*:
    # in C++ the caller owns the AlignParams and scoping keeps it honest, so the
    # bare-pointer-with-no-owner hazard does not arise there.  It arises only once
    # Python holds the other end of the lifetime — the layer that was, until this
    # job, never under a sanitizer.  SeqPairBatch.add_many() lives entirely in it:
    # the pairs are owned by C++ and hold a bare pointer to params that no Python
    # object of theirs keeps alive.
    #
    # Verified to work rather than assumed: against a binding that pins params in
    # a single slot instead of a list, this job fails with
    #   ERROR: AddressSanitizer: heap-use-after-free ... READ of size 8 ... thread T3
    # from test_dropping_params_after_two_add_many_calls.
    name: Python tests (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -fno-sanitize-recover=all (set in CMakeLists) is what makes this worth
      # anything: UBSan otherwise prints a diagnostic, carries on, and lets pytest
      # exit 0 over undefined behaviour.
      - name: Install with an instrumented extension
        env:
          CC: gcc
          CXX: g++
        run: |
          pip install -e ".[dev]" \
            --config-settings=cmake.define.NWGRAD_SANITIZE_EXT=ON \
            --config-settings=cmake.define.NWGRAD_SANITIZERS=${{ matrix.sanitizer }} \
            --config-settings=cmake.build-type=Debug

      - name: Test
        run: |
          if [ "${{ matrix.sanitizer }}" = "address" ]; then
            # ASan's runtime must be loaded before CPython's.  libstdc++ must be
            # preloaded WITH it: CPython does not link libstdc++, so ASan's
            # __cxa_throw interceptor finds no real symbol to forward to and dies
            # on the first C++ exception our bindings throw with
            #   CHECK failed: asan_interceptors.cpp "real___cxa_throw != 0"
            #
            # detect_leaks=0 is a real concession, not a formality: it gives up
            # LeakSanitizer, which is exactly what would catch a leaked staged
            # pair in add_many()'s throw path.  LSan cannot tell our leaks from
            # CPython's and numpy's intentional allocations in an uninstrumented
            # interpreter.  That check is not lost — it lives in the C++ ASan job,
            # where test_add_many.cpp throws from a worker mid-construction.
            export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libstdc++.so)"
            export ASAN_OPTIONS=detect_leaks=0
          else
            export UBSAN_OPTIONS=print_stacktrace=1
          fi
          # -s (no capture) is load-bearing.  Both sanitizers abort() the process
          # on a finding, and pytest's capture has replaced fd 2 with a buffer
          # that dies with it — so a captured run fails with a red tick and a
          # completely empty log.  Verified: with capture on, the injected
          # use-after-free produced rc=1 and zero bytes of output.
          pytest tests/Python/ -q -s

  headers:
    name: Header-only consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      # The library is advertised as header-only, with `python -m nwgrad --include`
      # giving the include path.  Compile against it exactly as a consumer would,
      # so a header that only compiles inside this repo's own build fails here.
      - name: Compile against the advertised include path
        run: |
          printf '#include <nwgrad/seq_pair_batch.hpp>\nint main() { return 0; }\n' > consumer.cpp
          c++ -std=c++20 -Wall -Wextra -I "$(python -m nwgrad --include)" consumer.cpp -o consumer
          ./consumer
